<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />

    <!-- iOS PWA / Status bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Theme color matches app background -->
    <meta name="theme-color" content="#F1F2F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101113" media="(prefers-color-scheme: dark)" />

    <!-- Prevent phone number detection -->
    <meta name="format-detection" content="telephone=no" />

    <!-- First-paint theme. Runs synchronously before any CSS/JS bundle so the very first
         frame already has the right light/dark class and (when a snapshot exists) the exact
         palette of the last session. Mirrors ThemeProvider's persisted-mode logic; the
         snapshot ("duo-boot-tokens") is written by themeEngine.applyTokens. Entirely
         best-effort: any failure falls through to the normal startup path (themeBoot.ts
         then ThemeProvider), which re-derives and re-applies the real tokens. -->
    <script>
      (function () {
        try {
          var L = localStorage, root = document.documentElement;
          var m = L.getItem("duo-theme-mode"), c = L.getItem("duo-color-mode");
          if (!m) m = c || "auto";
          var snap = null;
          try { snap = JSON.parse(L.getItem("duo-boot-tokens") || "null"); } catch (e) {}
          var dark;
          if (m === "dark") dark = true;
          else if (m === "light") dark = false;
          else if (m === "dynamic") dark = snap ? !!snap.dark : true;
          else if (m === "schedule") {
            var t = function (v, d) { var p = (v || d).split(":"); return (+p[0] || 0) * 60 + (+p[1] || 0); };
            var n = new Date(), now = n.getHours() * 60 + n.getMinutes();
            var s = t(L.getItem("duo-schedule-start"), "19:00"), e = t(L.getItem("duo-schedule-end"), "07:00");
            dark = s === e ? false : s < e ? now >= s && now < e : now >= s || now < e;
          } else if (c === "dark" || c === "light") dark = c === "dark";
          else dark = !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
          root.classList.toggle("dark", dark);
          if (snap && snap.tokens && !!snap.dark === dark) {
            for (var k in snap.tokens) root.style.setProperty(k, snap.tokens[k]);
          }
        } catch (err) { /* fall through to the normal startup path */ }
      })();
    </script>

    <title>DuoSpace</title>
    <meta name="description" content="A private space for two">

    <!-- Favicon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- NAME-03 FIX: PWA manifest so the installed app has a name and is installable.
         Previously there was no manifest at all — the PWA install name was frozen to
         whatever the browser inferred from <title>, with no icon or display config. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="DuoSpace" />    
  <!-- Fonts are self-hosted (public/fonts, generated by `npm run fonts:fetch`): no request to Google, so no visitor IP leaves for a third party. -->
  <link rel="stylesheet" href="/fonts/base.css" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="/fonts/base.css" /></noscript>

  <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/niQmqA70qEPIDBwCgRezhFg4zRg2/social-images/social-1784357839499-file_00000000f3b07207b0eb1f846f116198.webp">
  <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/niQmqA70qEPIDBwCgRezhFg4zRg2/social-images/social-1784357839499-file_00000000f3b07207b0eb1f846f116198.webp">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:type" content="website">
  <meta property="og:title" content="DuoSpace">
  <meta name="twitter:title" content="DuoSpace">
  <meta property="og:description" content="A private space for two">
  <meta name="twitter:description" content="A private space for two">
</head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
