<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />

    <!-- iOS PWA / Status bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Theme color matches app background -->
    <meta name="theme-color" content="#F6F6F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)" />

    <!-- Prevent phone number detection -->
    <meta name="format-detection" content="telephone=no" />

    <title>DuoSpace</title>
    <meta name="description" content="A private space for two">

    <!-- Favicon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- NAME-03 FIX: PWA manifest so the installed app has a name and is installable.
         Previously there was no manifest at all — the PWA install name was frozen to
         whatever the browser inferred from <title>, with no icon or display config. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="DuoSpace" />    
  <!-- Fonts: preconnect + non-blocking load (moved from CSS @import for performance) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" /></noscript>

  <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/niQmqA70qEPIDBwCgRezhFg4zRg2/social-images/social-1784357839499-file_00000000f3b07207b0eb1f846f116198.webp">
  <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/niQmqA70qEPIDBwCgRezhFg4zRg2/social-images/social-1784357839499-file_00000000f3b07207b0eb1f846f116198.webp">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:type" content="website">
  <meta property="og:title" content="DuoSpace">
  <meta name="twitter:title" content="DuoSpace">
  <meta property="og:description" content="A private space for two">
  <meta name="twitter:description" content="A private space for two">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
