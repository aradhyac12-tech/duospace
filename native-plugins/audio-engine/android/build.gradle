ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.0'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.2.1'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.6.1'
    // Media3 1.4.x — stable at time of writing, supports Android 14/15's
    // FOREGROUND_SERVICE_MEDIA_PLAYBACK requirements and MediaSessionService
    // out of the box. Free/open-source (Apache 2.0) — no licensing cost,
    // consistent with the $0 infra requirement for this feature.
    media3Version = project.hasProperty('media3Version') ? rootProject.ext.media3Version : '1.4.1'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
    }
}

apply plugin: 'com.android.library'

android {
    namespace "com.duospace.audioengine"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 23
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // ExoPlayer (playback engine) + MediaSession (lock-screen/notification/
    // Bluetooth command integration), plus the HLS extension.
    // FIX (SoundCloud auto-next silently not firing): this used to be
    // Audius-only, progressive-audio-only, so media3-exoplayer-hls was
    // deliberately left out as unused weight. SoundCloud (see
    // MediaPlaybackService.kt's buildMediaItem/isHlsStreamUrl) can resolve
    // to an HLS transcoding instead of a plain MP3 — without this
    // dependency, DefaultMediaSourceFactory has no HlsMediaSource
    // implementation to reflectively load for those URLs at all (MIME
    // hint or not), so that MediaItem errors immediately instead of ever
    // reaching STATE_ENDED, and the queue silently stalls on it forever.
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
